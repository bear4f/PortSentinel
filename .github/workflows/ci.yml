name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Bash syntax
        run: find . -type f \( -name '*.sh' -o -path './bin/portsentinel' \) -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: shellcheck bin/portsentinel install.sh uninstall.sh tests/*.sh
      - name: Test
        run: bash tests/run-tests.sh
